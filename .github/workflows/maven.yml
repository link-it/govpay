name: Java CI with Maven

on:
  push:
    branches: [ "**" ]  # TODO: restringere a [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  id-token: write
  actions: write

jobs:

  # ── Build, Test, Quality ─────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set timezone to Europe/Rome
      run: sudo timedatectl set-timezone Europe/Rome

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check NVD_API_KEY
      run: |
        if [ -z "$NVD_API_KEY" ]; then
          echo "NVD_API_KEY is NOT set!"
        else
          echo "NVD_API_KEY is set."
        fi
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: Check OSS_INDEX_USER
      run: |
        if [ -z "$OSS_INDEX_USER" ]; then
          echo "OSS_INDEX_USER is NOT set!"
        else
          echo "OSS_INDEX_USER is set."
        fi
      env:
        OSS_INDEX_USER: ${{ vars.OSS_INDEX_USER }}

    - name: Check OSS_INDEX_PASSWORD
      run: |
        if [ -z "$OSS_INDEX_PASSWORD" ]; then
          echo "OSS_INDEX_PASSWORD is NOT set!"
        else
          echo "OSS_INDEX_PASSWORD is set."
        fi
      env:
        OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}

    - name: Cache OWASP Dependency-Check DB
      uses: actions/cache@v4
      with:
        path: .dependency-check/data
        key: ${{ runner.os }}-owasp-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-owasp-

    - name: Build with Maven
      run: mvn clean install -Denv=installer_template -DnvdApiKey=$NVD_API_KEY -DossIndexUsername=$OSS_INDEX_USER -DossIndexPassword=$OSS_INDEX_PASSWORD -DdataDirectory=.dependency-check/data -Dowasp.format=ALL -Dowasp.output.dir=./dependency-check-report
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        OSS_INDEX_USER: ${{ vars.OSS_INDEX_USER }}
        OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}

    - name: License Analysis
      run: |
        set -euo pipefail
        echo "Downloading license information..."
        mvn org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-download-licenses -DexcludeScopes=test,provided,system -DincludeTransitiveDependencies=true
        echo "Analyzing licenses..."
        python3 .github/workflows/scripts/analyze_licenses.py --exceptions .github/workflows/scripts/license-exceptions.json

    - name: Archive licenses analysis results
      uses: actions/upload-artifact@v4
      with:
        name: third-party-licenses
        path: third-party-licenses

    - name: Collect OWASP reports
      if: always()
      run: |
        mkdir -p target/reports
        find . -name "dependency-check-report.*" -exec cp {} target/reports/ \; 2>/dev/null || true

    - name: Upload OWASP reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: owasp-reports
        path: target/reports/
        retention-days: 30

  # ── OSV Scan (parallelo al build, non blocca) ────────────────────────
  osv_scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5"
    with:
      fail-on-vuln: false
      scan-args: |-
        -r
        .
        --lockfile
        ./pom.xml

  # ── GitHub Release (solo tag) ────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [ build, osv_scan ]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build release artifacts
      run: mvn clean install -Denv=installer_template -Dowasp=none

    - name: Generate Tomcat installer
      run: |
        pushd src/main/resources/setup/
        sh prepareSetup.sh tomcat
        popd

    - name: Download OWASP reports
      uses: actions/download-artifact@v4
      with:
        name: owasp-reports
        path: reports/owasp/

    - name: Download third-party-licenses
      uses: actions/download-artifact@v4
      with:
        name: third-party-licenses
        path: reports/third-party-licenses/

    - name: Download OSV Scanner SARIF
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: OSV Scanner SARIF file
        path: reports/osv/

    - name: Collect release artifacts
      run: |
        mkdir -p release-artifacts
        cp src/main/resources/setup/target/*.tgz release-artifacts/
        ls -lh release-artifacts/

    - name: Assemble reports ZIP
      run: |
        mkdir -p reports/owasp reports/osv reports/third-party-licenses

        # pipeline info
        echo "Pipeline Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          > reports/${{ github.ref_name }}_actions_run.txt

        zip -r release-artifacts/release-reports-${{ github.ref_name }}.zip reports/
        ls -lh release-artifacts/

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2.2.1
      with:
        files: |
          release-artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
