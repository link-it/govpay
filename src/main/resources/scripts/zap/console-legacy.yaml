# Piano ZAP (Automation Framework) per il cruscotto attuale (war su Tomcat).
#
# Perche' un piano e non "zap-baseline.py -t <url>": il baseline costruisce il
# contesto dal solo host, e sul cruscotto attuale - servito dallo stesso Tomcat
# delle war di API - lo spider risaliva alla radice percorrendo /examples,
# /docs, /manager e /host-manager: il report descriveva il server invece
# dell'applicazione. Con il piano l'ambito e' dichiarato (includePaths) e il
# comportamento e' lo stesso per tutti e tre i bersagli.
#
# Restano fuori gli URL di logout: seguirli butterebbe giu' la sessione a meta'
# scansione.
env:
  contexts:
    - name: console-legacy
      urls:
        - "http://localhost:8080/govpay-console"
      includePaths:
        - "http://localhost:8080/govpay-console.*"
      excludePaths:
        - ".*logout.*"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  # Le segnalazioni verificate e accettate si dichiarano qui, una per volta e
  # con il motivo nel commento: servono a tenere il report leggibile, non a
  # nascondere i problemi. Il job va prima delle scansioni, perche' agisce
  # sugli alert man mano che vengono sollevati.
  - type: alertFilter
    alertFilters:
      # Timestamp Disclosure: i valori in vendor.bundle.js sono costanti degli
      # algoritmi di hash di crypto-js (SHA-1 0x5A827999 e 0x6ED9EBA1, valore
      # iniziale MD5/SHA-1 0x67452301, RIPEMD-160 0x6D703EF3 e 0x50A28BE6), non date.
      - ruleId: 10096
        newRisk: "False Positive"
        url: ".*/vendor\\.bundle\\.js"
        urlRegex: true

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10

  # Spider classico: la struttura statica (asset, pagine servite dal server).
  - type: spider
    parameters:
      context: console-legacy
      maxDuration: 3

  # Spider client: indispensabile su una SPA Angular, dove la navigazione
  # avviene in JavaScript e lo spider classico vedrebbe una pagina sola.
  - type: spiderClient
    parameters:
      context: console-legacy
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: console-legacy.html
      reportTitle: "ZAP - il cruscotto attuale (war su Tomcat)"
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: console-legacy.json
  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk
      reportFile: console-legacy.xml
