# Piano ZAP (Automation Framework) per il portale di pagamento (container).
#
# Perche' un piano e non "zap-baseline.py -t <url>": il baseline costruisce il
# contesto dal solo host, e sul cruscotto attuale - servito dallo stesso Tomcat
# delle war di API - lo spider risaliva alla radice percorrendo /examples,
# /docs, /manager e /host-manager: il report descriveva il server invece
# dell'applicazione. Con il piano l'ambito e' dichiarato (includePaths) e il
# comportamento e' lo stesso per tutti e tre i bersagli.
#
# Restano fuori gli URL di logout: seguirli butterebbe giu' la sessione a meta'
# scansione.
env:
  contexts:
    - name: portale
      urls:
        - "http://localhost:10011"
      includePaths:
        - "http://localhost:10011.*"
      excludePaths:
        - ".*logout.*"
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true

jobs:
  # Le segnalazioni verificate e accettate si dichiarano qui, una per volta e
  # con il motivo nel commento: servono a tenere il report leggibile, non a
  # nascondere i problemi. Il job va prima delle scansioni, perche' agisce
  # sugli alert man mano che vengono sollevati.
  #
  # Information in Browser localStorage (120000, gia' Informational): accettato.
  # "govpay_cart" e' il carrello, che deve sopravvivere al ritorno dal checkout
  # pagoPA; contiene solo i campi di CART_ITEM_FIELDS (pay.service.ts: avviso,
  # causale, importo, scadenze, ente), senza i dati del debitore.
  - type: alertFilter
    alertFilters:
      # Timestamp Disclosure: 1831565813 e' 0x6D2B79F5, la costante del generatore
      # pseudo-casuale Mulberry32 di SurveyJS (survey-core), non una data. Filtro sul valore
      # perche' il nome del chunk cambia a ogni build.
      - ruleId: 10096
        newRisk: "False Positive"
        evidence: "1831565813"
      # Cookie No HttpOnly Flag su XSRF-TOKEN: accettato. Il cookie deve essere
      # leggibile da JavaScript, perche' Angular ne rimanda il valore nell'header
      # X-XSRF-TOKEN (protezione CSRF double submit di govpay-portal-api).
      - ruleId: 10010
        newRisk: "Info"
        parameter: "XSRF-TOKEN"

  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10

  # Spider classico: la struttura statica (asset, pagine servite dal server).
  - type: spider
    parameters:
      context: portale
      maxDuration: 3

  # Spider client: indispensabile su una SPA Angular, dove la navigazione
  # avviene in JavaScript e lo spider classico vedrebbe una pagina sola.
  - type: spiderClient
    parameters:
      context: portale
      maxDuration: 3

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: portale.html
      reportTitle: "ZAP - il portale di pagamento (container)"
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: portale.json
  - type: report
    parameters:
      template: traditional-xml
      reportDir: /zap/wrk
      reportFile: portale.xml
